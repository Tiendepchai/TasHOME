name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Isolated Node smoke (never root npm test)
        run: node scripts/binary.self-check.mjs
      - run: npm run build:binary
      - name: Run standalone ARM64 binary
        run: node scripts/binary.self-check.mjs artifacts/bun-linux-arm64/tashome-linux-arm64
      - name: Validate deployment helpers and rollback
        run: |
          bash -n scripts/deploy.sh scripts/update.sh
          python3 -I deploy/rollback.self-check.py
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tashome-linux-arm64-${{ github.sha }}
          path: artifacts/bun-linux-arm64/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
